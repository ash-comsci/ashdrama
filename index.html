<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Welcome to the All Saints Drama Guild. The curtain is about to rise.">
  <title>Welcome | All Saints Drama Guild</title>
  <link rel="icon" href="images/ash-drama-logo.png">
  <link rel="preload" as="image" href="images/ash-drama-logo.png">
  <link rel="stylesheet" href="css/opening.css">
  <script src="js/opening.js" defer></script>
</head>
<body>
  <main class="stage" aria-label="Welcome to All Saints Drama Guild">
    <div class="stage-halo" aria-hidden="true"></div>

    <div class="spotlight spotlight-right" aria-hidden="true"></div>
    <div class="spotlight spotlight-centre" aria-hidden="true"></div>
    <div class="curtain curtain-left" aria-hidden="true"></div>
    <div class="curtain curtain-right" aria-hidden="true"></div>
    <div class="valance" aria-hidden="true"></div>
    <div class="marquee" aria-hidden="true"></div>

      <p class="school">ALL SAINTS HIGH SCHOOL</p>

      <a class="enter" href="https://ashdrama.ca/test/index.html">Enter site <span aria-hidden="true">→</span></a>
      <div class="progress" aria-hidden="true"><span></span></div>
      <noscript><p class="no-script">Select “Enter site” to continue.</p></noscript>

</html>
