<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game of Tiaras — Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0f0a0c; --ink:#f3ece4; --muted:#b9a9a3; --accent:#c8202a; --gold:#f2d21b; }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100%; overflow:hidden }
  body{
    background:
      radial-gradient(ellipse 65% 60% at 50% 45%, rgba(160,18,28,.30), transparent 72%),
      var(--bg);
    color:var(--ink); font-family:Inter,system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  #stage{ position:fixed; inset:0 0 64px 0; display:flex; align-items:center; justify-content:center }
  #bookWrap{ position:relative; transition:transform .7s cubic-bezier(.4,.1,.2,1) }
  #book{ margin:0 auto }
  .page{ background:#fff; overflow:hidden }
  .page img{ width:100%; height:100%; display:block; object-fit:contain; pointer-events:none }
  .stf__parent{ filter:drop-shadow(0 20px 40px rgba(0,0,0,.6)) }

  .nav{
    position:fixed; top:calc(50% - 32px); transform:translateY(-50%); z-index:20;
    width:48px; height:48px; border-radius:50%; border:1px solid rgba(255,255,255,.18);
    background:rgba(20,14,16,.65); color:var(--ink); font-size:26px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    backdrop-filter:blur(6px); transition:background .2s, opacity .2s;
  }
  .nav:hover{ background:var(--accent) }
  .nav:disabled{ opacity:.2; cursor:default; background:rgba(20,14,16,.65) }
  #prev{ left:14px } #next{ right:14px }

  #bar{
    position:fixed; left:0; right:0; bottom:0; height:64px; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:10px; padding:0 10px;
  }
  #bar button{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:var(--ink);
    font:500 13px Inter,sans-serif; padding:8px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  #bar button:hover{ background:rgba(255,255,255,.16) }
  #title{ font-family:Cinzel,serif; letter-spacing:.12em; font-weight:700; font-size:14px; text-transform:uppercase; opacity:.85 }
  #counter{ min-width:150px; text-align:center; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums }
  #thumbs{ display:flex; gap:6px }
  #thumbs button{ width:26px !important; height:40px; padding:0 !important; border-radius:3px !important; overflow:hidden; border:2px solid transparent !important; opacity:.5; background:#fff !important }
  #thumbs button.on{ opacity:1; border-color:var(--gold) !important }
  #thumbs img{ width:100%; height:100%; object-fit:cover; display:block }

  /* opening splash + intro */
  #splash{
    position:fixed; inset:0; z-index:50; overflow:hidden; cursor:pointer;
    background:radial-gradient(ellipse 80% 70% at 50% 35%, #2a0a12, #070405 75%);
    transition:opacity .6s ease;
  }
  #splash.hide{ opacity:0; pointer-events:none }
  .sp-content{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(6px,1.5vh,14px); padding:16px; text-align:center;
  }
  .logoWrap{
    position:relative; z-index:5; line-height:0;
    transform:translate(var(--tx,0),var(--ty,0)) scale(calc(var(--s,1) * .82));
    opacity:0; transition:transform 1.3s cubic-bezier(.2,.8,.2,1), opacity 1s ease;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));
  }
  .logoWrap img{ height:clamp(58px,11vh,110px); width:auto; display:block }
  .logoWrap::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
    background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%);
    background-size:300% 100%; background-position:100% 0; mix-blend-mode:screen;
    -webkit-mask:url(ash-logo.webp) center / contain no-repeat; mask:url(ash-logo.webp) center / contain no-repeat;
  }
  #splash.p2 .logoWrap{ opacity:1; transform:translate(var(--tx,0),var(--ty,0)) scale(var(--s,1)) }
  #splash.p3 .logoWrap::after{ animation:shine 1.4s ease-in-out forwards }
  #splash.p4 .logoWrap{ transform:none; transition:transform 1.5s cubic-bezier(.65,0,.25,1), opacity 1s }
  @keyframes shine{ 0%{opacity:1; background-position:100% 0} 100%{opacity:1; background-position:0% 0} }

  .bigPresents{
    position:absolute; left:0; right:0; top:var(--py,62%); z-index:5; text-align:center;
    font-family:Cinzel,serif; letter-spacing:.45em; text-transform:uppercase; font-size:clamp(13px,2vw,20px);
    color:#f6e7c8; text-shadow:0 0 18px rgba(255,200,120,.45);
    opacity:0; transform:translateY(10px); transition:opacity .9s ease, transform .9s ease;
  }
  #splash.p3 .bigPresents{ opacity:1; transform:none }
  #splash.p4 .bigPresents{ opacity:0; transition-duration:.4s }

  .late{ position:relative; z-index:4; opacity:0; transform:translateY(16px); transition:opacity .9s ease, transform .9s ease }
  #splash.p4 .late{ opacity:1; transform:none; transition-delay:calc(1.1s + var(--d,0s)) }
  .presents{ font-family:Cinzel,serif; font-size:11px; letter-spacing:.4em; text-transform:uppercase; color:var(--muted); margin:0 }
  .sp-cover{ height:min(42vh,400px); box-shadow:0 20px 50px rgba(0,0,0,.7); border-radius:2px }
  #splash h1{ font-family:Cinzel,serif; letter-spacing:.14em; margin:0; font-size:clamp(22px,4vw,34px); text-transform:uppercase }
  #splash .sub{ margin:0; color:var(--muted); font-size:14px }
  #splash .go{
    background:var(--accent); color:#fff; border:0; font:600 16px Inter,sans-serif;
    padding:12px 26px; border-radius:999px; cursor:pointer; box-shadow:0 8px 24px rgba(200,32,42,.4);
  }
  #splash.done .go{ animation:pulse 2s infinite }
  @keyframes pulse{ 50%{ transform:scale(1.05) } }

  /* curtains */
  .curtain{
    position:absolute; top:0; bottom:0; width:51%; z-index:2;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.45), transparent 18%, transparent 75%, rgba(0,0,0,.6)),
      repeating-linear-gradient(90deg, #4a050c 0, #7d0c18 2.2%, #b0172a 4.2%, #8a0e1b 6%, #4a050c 8%);
    transition:transform 2s cubic-bezier(.6,0,.2,1);
  }
  .curtain.l{ left:0; box-shadow:inset -30px 0 40px rgba(0,0,0,.55) }
  .curtain.r{ right:0; box-shadow:inset 30px 0 40px rgba(0,0,0,.55) }
  .valance{
    position:absolute; top:0; left:0; right:0; height:9vh; z-index:2;
    background:
      radial-gradient(ellipse 50% 100% at 50% 0, #9a1324 60%, transparent 62%) 0 0 / 12vh 100% repeat-x,
      linear-gradient(#5e0812,#5e0812) 0 0 / 100% 45% no-repeat;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)); transition:transform 1.6s cubic-bezier(.6,0,.2,1);
  }
  #splash.p4 .curtain.l{ transform:translateX(-100%) }
  #splash.p4 .curtain.r{ transform:translateX(100%) }
  #splash.p4 .valance{ transform:translateY(-100%); transition-delay:.6s }

  /* spotlights */
  .beams{ position:absolute; inset:0; z-index:3; pointer-events:none; mix-blend-mode:screen; transition:opacity 1.5s ease }
  #splash.p4 .beams{ opacity:.4 }
  .beam{
    position:absolute; top:-3%; width:36vmin; height:125vh; left:calc(var(--x) - 18vmin);
    transform-origin:50% 0; transform:rotate(var(--r));
    background:linear-gradient(to bottom, var(--c) 0%, color-mix(in srgb, var(--c) 35%, transparent) 55%, transparent 92%);
    clip-path:polygon(45% 0, 55% 0, 100% 100%, 0 100%); filter:blur(5px); opacity:0;
  }
  #splash.p1 .beam{ animation:beamOn .7s var(--d) forwards, sway 4.5s ease-in-out var(--d) infinite alternate }
  @keyframes beamOn{ 0%{opacity:0} 25%{opacity:.75} 40%{opacity:.1} 55%{opacity:.85} 100%{opacity:.6} }
  @keyframes sway{ from{ transform:rotate(calc(var(--r) - 7deg)) } to{ transform:rotate(calc(var(--r) + 7deg)) } }
  .lamp{
    position:absolute; top:-10px; width:26px; height:26px; margin-left:-13px; left:var(--x); border-radius:50%;
    background:radial-gradient(circle, #fff 0 25%, var(--c) 45%, transparent 70%); opacity:0; z-index:3;
  }
  #splash.p1 .lamp{ animation:beamOn .7s var(--d) forwards }

  /* floating dust in the light */
  .dust{ position:absolute; z-index:3; width:3px; height:3px; border-radius:50%; background:#fff; opacity:0; pointer-events:none;
    animation:drift var(--t) linear var(--dl) infinite }
  @keyframes drift{ 0%{ opacity:0; transform:translate(0,0) } 15%{ opacity:.55 } 85%{ opacity:.35 } 100%{ opacity:0; transform:translate(var(--dx),-28vh) } }

  .skip{ position:absolute; bottom:16px; left:0; right:0; text-align:center; z-index:6; color:rgba(255,255,255,.45); font-size:12px; letter-spacing:.1em; transition:opacity .5s }
  #splash.p4 .skip{ opacity:0 }

  #splash.fast *, #splash.fast *::after{ transition-duration:.35s !important; transition-delay:0s !important }
  #splash.fast .late{ transition-delay:.2s !important }

  /* zoom */
  #zoom{ position:fixed; inset:0; z-index:60; background:rgba(8,5,6,.96); display:none; overflow:auto; padding:60px 12px 24px }
  #zoom.open{ display:block }
  #zoom img{ display:block; margin:0 auto 12px; width:min(100%,1100px); background:#fff }
  #zoomClose{ position:fixed; top:12px; right:12px; z-index:61; background:var(--accent); color:#fff; border:0; font:600 14px Inter,sans-serif; padding:8px 14px; border-radius:999px; cursor:pointer }

  @media (max-width:700px){
    #title, #thumbs{ display:none }
    .nav{ width:40px; height:40px; font-size:22px; background:rgba(20,14,16,.5) }
    #prev{ left:6px } #next{ right:6px }
    #counter{ min-width:0 }
  }
</style>
</head>
<body>

<div id="stage"><div id="bookWrap"><div id="book"></div></div></div>
<button class="nav" id="prev" aria-label="Previous page">&#8249;</button>
<button class="nav" id="next" aria-label="Next page">&#8250;</button>

<div id="bar">
  <span id="title">Game of Tiaras</span>
  <span id="counter"></span>
  <div id="thumbs"></div>
  <button id="zoomBtn">&#128269; Zoom</button>
  <button id="fsBtn">&#x26F6; Full screen</button>
</div>

<div id="splash" role="button" aria-label="Open the program">
  <div class="beams" id="beams"></div>
  <div class="curtain l"></div><div class="curtain r"></div><div class="valance"></div>
  <div class="sp-content">
    <div class="logoWrap" id="logoWrap"><img src="ash-logo.webp" alt="ASH Drama Guild"></div>
    <p class="presents late">proudly presents</p>
    <img class="sp-cover late" style="--d:.15s" src="pages/p00.jpg" alt="Game of Tiaras program cover">
    <h1 class="late" style="--d:.3s">Game of Tiaras</h1>
    <p class="sub late" style="--d:.4s">All Saints Catholic High School · Drama Production</p>
    <button class="go late" style="--d:.55s">Open the Program</button>
  </div>
  <div class="bigPresents" id="bigPresents">proudly presents</div>
  <div class="skip">Tap to skip</div>
</div>

<div id="zoom" role="dialog" aria-label="Zoomed page">
  <button id="zoomClose">Close ✕</button>
  <div id="zoomPages"></div>
</div>

<script src="page-flip.js"></script>
<script>
/* ------- PAGE LIST: add new pages here, in reading order ------- */
const PAGES = [
  { src: "pages/p00.png", label: "Cover" },
  { src: "pages/p01.png", label: "Credits" },
  { src: "pages/p02.png", label: "Credits (cont.)" },
  { src: "pages/p03.png", label: "Who's Who" },
  { src: "pages/p04.png", label: "Who's Who (cont.)" },
  { src: "pages/p05.png", label: "Who's Who (cont.)" },
  { src: "pages/p06.png", label: "Who's Who (cont.)" },
  { src: "pages/p07.png", label: "Who's Who (cont.)" },
  { src: "pages/p08.png", label: "Who's Who (cont.)" },
  { src: "pages/p09.png", label: "Who's Who (cont.)" },
  { src: "pages/p10.png", label: "Who's Who (cont.)" },
  { src: "pages/p11.png", label: "Who's Who (cont.)" },
    { src: "pages/p12.png", label: "Who's Who (cont.)" },
];
const RATIO = 357 / 585; // page width / height
/* --------------------------------------------------------------- */

const N = PAGES.length;
const bookWrap = document.getElementById('bookWrap');
const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
const counter = document.getElementById('counter'), thumbs = document.getElementById('thumbs');
let flip = null, current = 0, portrait = false, PW = 300;

PAGES.forEach(p => { const i = new Image(); i.src = p.src; }); // preload

PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.title = p.label; b.setAttribute('aria-label', 'Go to ' + p.label);
  b.innerHTML = `<img src="${p.src}" alt="">`;
  b.onclick = () => goTo(i);
  thumbs.appendChild(b);
});

function dims() {
  const narrow = innerWidth < 700;
  const sidePad = narrow ? 8 : 80;
  const W = innerWidth - sidePad * 2, H = innerHeight - 64 - 20;
  portrait = narrow || innerWidth < innerHeight * 0.95;
  let pw = portrait ? Math.min(W, H * RATIO) : Math.min(W / 2, H * RATIO);
  pw = Math.max(140, Math.floor(pw));
  return { pw, ph: Math.floor(pw / RATIO) };
}

function build() {
  const { pw, ph } = dims();
  PW = pw;
  if (flip) { current = flip.getCurrentPageIndex(); flip.destroy(); }
  bookWrap.innerHTML = '<div id="book"></div>';
  const book = document.getElementById('book');
  book.style.width = (portrait ? pw : pw * 2) + 'px';
  book.style.height = ph + 'px';
  PAGES.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'page';
    if (i === 0) d.dataset.density = 'hard';
    d.innerHTML = `<img src="${p.src}" alt="${p.label}">`;
    book.appendChild(d);
  });
  flip = new St.PageFlip(book, {
    width: pw, height: ph, size: 'fixed',
    showCover: true, usePortrait: portrait,
    maxShadowOpacity: 0.55, flippingTime: 850,
    mobileScrollSupport: false, startPage: current,
    drawShadow: true, autoSize: false,
  });
  flip.loadFromHTML(book.querySelectorAll('.page'));
  flip.on('flip', e => { current = e.data; update(); });
  flip.on('changeOrientation', update);
  flip.on('changeState', e => {
    if (e.data === 'flipping' || e.data === 'user_fold') {
      const i = flip.getCurrentPageIndex();
      if (i === 0) center(1);
    }
  });
  update();
}

function visible() {
  if (!flip) return [0];
  const i = flip.getCurrentPageIndex();
  if (portrait || i === 0) return [i];
  // spreads after the cover: (1,2), (3,4) ...
  const left = i % 2 === 1 ? i : i - 1;
  return [left, left + 1].filter(x => x < N);
}

function center(idx) {
  let shift = 0;
  if (!portrait) {
    if (idx === 0) shift = -PW / 2;
    else if (N % 2 === 0 && idx >= N - 1) shift = PW / 2;
  }
  bookWrap.style.transform = `translateX(${shift}px)`;
}

function update() {
  const v = visible();
  center(flip ? flip.getCurrentPageIndex() : 0);
  counter.textContent = v.map(i => PAGES[i].label).join('  ·  ') + `   (${v[v.length-1] + 1} / ${N})`;
  prevBtn.disabled = v[0] === 0;
  nextBtn.disabled = v[v.length - 1] >= N - 1;
  [...thumbs.children].forEach((b, i) => b.classList.toggle('on', v.includes(i)));
}

function goTo(i) { if (flip) { center(i); flip.flip(i); } }
function next() { if (!flip) return; const i = flip.getCurrentPageIndex(); if (i === 0) center(1); flip.flipNext(); }
function prev() { if (!flip) return; const i = flip.getCurrentPageIndex(); if (i <= 2) center(0); flip.flipPrev(); }
prevBtn.onclick = prev;
nextBtn.onclick = next;
let lastIdx = 0;

document.addEventListener('keydown', e => {
  if (zoom.classList.contains('open')) { if (e.key === 'Escape') zoom.classList.remove('open'); return; }
  if (!splash.classList.contains('hide') && (e.key === 'Enter' || e.key === ' ')) { open(); return; }
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End') goTo(N - 1);
});

/* fullscreen */
function enterFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
  } else enterFullscreen();
}
const fsBtn = document.getElementById('fsBtn');
fsBtn.onclick = toggleFullscreen;
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.style.display = 'none';

/* splash intro: spotlights, ASH Drama Guild logo, curtains open.
   Browsers only allow full screen after a tap/click, so the first tap also goes full screen. */
const splash = document.getElementById('splash');
const logoWrap = document.getElementById('logoWrap');
const beamsEl = document.getElementById('beams');
const LIGHTS = [
  { c:'#ff2bd6', x:12, r:-20 }, { c:'#2f6bff', x:31, r:-10 }, { c:'#2fe04a', x:50, r:0 },
  { c:'#ffa21a', x:69, r:10 },  { c:'#ff2b2b', x:88, r:20 },
];
LIGHTS.forEach((L, i) => {
  const vars = `--c:${L.c};--x:${L.x}%;--r:${L.r}deg;--d:${(0.25 + i * 0.22).toFixed(2)}s`;
  beamsEl.insertAdjacentHTML('beforeend', `<div class="beam" style="${vars}"></div>`);
  splash.insertAdjacentHTML('beforeend', `<div class="lamp" style="${vars}"></div>`);
});
for (let i = 0; i < 26; i++) {
  const d = document.createElement('div');
  d.className = 'dust';
  d.style.cssText = `left:${10 + Math.random() * 80}%;top:${35 + Math.random() * 60}%;` +
    `--t:${6 + Math.random() * 6}s;--dl:${Math.random() * 6}s;--dx:${(Math.random() * 60 - 30).toFixed(0)}px;` +
    `width:${1 + Math.random() * 2.5}px;height:${1 + Math.random() * 2.5}px`;
  splash.appendChild(d);
}

function placeBigLogo() {
  // measure the logo's final (small) spot, then park it big in the centre
  logoWrap.style.transition = 'none';
  logoWrap.style.setProperty('--tx', '0px'); logoWrap.style.setProperty('--ty', '0px'); logoWrap.style.setProperty('--s', '1');
  const prevT = logoWrap.style.transform; logoWrap.style.transform = 'none';
  const r = logoWrap.getBoundingClientRect();
  logoWrap.style.transform = prevT;
  const targetW = Math.min(innerWidth * 0.82, 620, (innerHeight * 0.5) * (r.width / r.height));
  const s = targetW / r.width;
  const cx = innerWidth / 2, cy = innerHeight * 0.44;
  logoWrap.style.setProperty('--tx', (cx - (r.left + r.width / 2)) + 'px');
  logoWrap.style.setProperty('--ty', (cy - (r.top + r.height / 2)) + 'px');
  logoWrap.style.setProperty('--s', s.toFixed(3));
  splash.style.setProperty('--py', (cy + (r.height * s) / 2 + 22) + 'px');
  logoWrap.offsetWidth; // flush
  logoWrap.style.transition = '';
}

let introDone = false;
const timers = [];
function phase(n) { splash.classList.add('p' + n); }
function finishIntro() { introDone = true; splash.classList.add('done'); }
function skipIntro() {
  timers.forEach(clearTimeout);
  splash.classList.add('fast');
  [1, 2, 3, 4].forEach(phase);
  setTimeout(() => { splash.classList.remove('fast'); finishIntro(); }, 700);
}
function startIntro() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    splash.classList.add('fast'); [1, 2, 3, 4].forEach(phase); finishIntro(); return;
  }
  placeBigLogo();
  timers.push(setTimeout(() => phase(1), 150));
  timers.push(setTimeout(() => phase(2), 1500));
  timers.push(setTimeout(() => phase(3), 2700));
  timers.push(setTimeout(() => phase(4), 4500));
  timers.push(setTimeout(finishIntro, 6600));
}
addEventListener('resize', () => { if (!splash.classList.contains('p4')) placeBigLogo(); });

function open() {
  enterFullscreen();
  if (!introDone) { skipIntro(); return; }
  splash.classList.add('hide');
}
splash.addEventListener('click', open);
const logoImg = logoWrap.querySelector('img');
if (logoImg.complete) startIntro(); else { logoImg.onload = startIntro; logoImg.onerror = startIntro; }

/* zoom */
const zoom = document.getElementById('zoom');
document.getElementById('zoomBtn').onclick = () => {
  document.getElementById('zoomPages').innerHTML =
    visible().map(i => `<img src="${PAGES[i].src}" alt="${PAGES[i].label}">`).join('');
  zoom.classList.add('open'); zoom.scrollTo(0, 0);
};
document.getElementById('zoomClose').onclick = () => zoom.classList.remove('open');

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 180); });
build();
</script>
</body>
</html>
